<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MFC">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>MFC Coaching</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
:root{--bg:#0A1128;--bg2:#0D1631;--card:#121C3D;--card2:#1B2750;--gold:#D4AF6A;--silver:#C9CED6;--muted:#9AA3B5;--dim:#6F7A92;--line:rgba(201,206,214,.12);--warn:#FF8A5C;--ok:#2ECC8F;--text:#F4F5F7;--ac:#D4AF6A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 60% at 100% 0%,rgba(79,139,255,.10),transparent 60%),radial-gradient(90% 50% at 0% 0%,rgba(212,175,106,.10),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 110px);display:flex;flex-direction:column;gap:14px}
h1{font-family:Sora,Inter,sans-serif;font-size:27px;font-weight:600;margin:0;letter-spacing:-.4px}
h2{font-family:Sora,Inter,sans-serif;font-size:19px;font-weight:600;margin:0;letter-spacing:-.2px}
h3{font-family:Sora,Inter,sans-serif;font-size:16px;font-weight:600;margin:0}
p{margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.gold{color:var(--gold)}.muted{color:var(--muted)}.dim{color:var(--dim)}.warn{color:var(--warn)}.okc{color:var(--ok)}.small{font-size:14px}.xs{font-size:12px}.b{font-weight:600}.lh{line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{min-height:52px;border-radius:15px;border:none;background:var(--gold);color:var(--bg);font-weight:700;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.ac{background:var(--ac);color:#0A1128}
.btn.ghost{background:rgba(255,255,255,.04);border:1px solid rgba(201,206,214,.22);color:var(--text);font-weight:600}
.btn.sm{min-height:40px;font-size:13px;width:auto;padding:0 14px;border-radius:12px}
.btn.dashed{background:transparent;border:1.5px dashed rgba(201,206,214,.3);color:var(--silver);font-weight:600;font-size:14px}
.btn.danger{background:transparent;border:1px solid rgba(255,138,92,.5);color:var(--warn)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;color:var(--text)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(13,22,49,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);display:grid;z-index:10}
.tabs button{background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;min-height:50px;justify-content:center;position:relative}
.tabs button.on{color:var(--gold)}
.tabs .badge{position:absolute;top:6px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--bg2)}
.top{display:flex;align-items:center;gap:6px;margin:-6px 0 0 -10px}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--silver);flex-shrink:0;border-radius:12px}
.bar{height:6px;background:rgba(201,206,214,.12);border-radius:3px;overflow:hidden}.bar>div{height:100%;background:var(--ac);border-radius:3px;transition:width .3s}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.sw{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid rgba(201,206,214,.22);background:transparent;color:var(--silver);font-size:13px;font-weight:500;flex-shrink:0}
.chip.on{border-color:var(--gold);background:rgba(212,175,106,.14);color:var(--gold);font-weight:700}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.scroll-x::-webkit-scrollbar{display:none}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field textarea,.field select,.inp{width:100%;min-height:48px;border-radius:12px;border:1px solid rgba(201,206,214,.18);background:var(--bg);color:var(--text);font-size:16px;font-weight:500;padding:0 14px}
.field textarea,textarea.inp{padding:12px 14px;resize:none;line-height:1.45}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 10px;border-radius:13px;font-size:12px;border:1.5px solid transparent;background:rgba(255,255,255,.03)}
.wd .c{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:Sora,sans-serif;font-size:21px;font-weight:600}
.kpi span{font-size:12px;color:var(--muted)}
.line{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.line:last-child{border-bottom:none}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(255,138,92,.1);border:1px solid rgba(255,138,92,.3);font-size:14px;line-height:1.45}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.55}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%) translateY(-8px);background:var(--card2);border:1px solid rgba(212,175,106,.45);padding:11px 16px;border-radius:13px;font-size:14px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Accent de séance */
.hero{border:none;padding:0;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 30%,#121C3D) 0%,#121C3D 55%);box-shadow:0 18px 40px -18px color-mix(in srgb,var(--ac) 60%,transparent)}
.hero .in{padding:20px;display:flex;flex-direction:column;gap:14px}
.edge{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ac)}
.exl{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.exl:last-child{border-bottom:none}
/* Planning */
.day{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:stretch}
.day .d{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;padding:8px 0;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.day .d b{font-family:Sora,sans-serif;font-size:19px;color:var(--text);letter-spacing:0}
.day.today .d{background:var(--gold);color:var(--bg)}.day.today .d b{color:var(--bg)}
.sess{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%;color:var(--text);position:relative;overflow:hidden}
.sess .edge{width:5px}
.rest-day{display:flex;align-items:center;padding:0 14px;min-height:50px;border-radius:15px;border:1.5px dashed rgba(201,206,214,.14);color:var(--dim);font-size:13px;width:100%;background:none;text-align:left;justify-content:space-between}
/* Séance */
.exc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
.exc.cur{border-color:color-mix(in srgb,var(--ac) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 35%,transparent)}
.exh{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;background:none;border:none;color:var(--text);text-align:left}
.num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;background:rgba(255,255,255,.06);color:var(--silver)}
.exb{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.sets{display:grid;grid-template-columns:30px 1fr 1fr 1fr 48px;gap:8px;align-items:center;text-align:center}
.sets input{width:100%;height:46px;border-radius:12px;border:1px solid rgba(201,206,214,.18);background:var(--bg);color:var(--text);text-align:center;font-weight:700;font-size:17px;padding:0 2px}
.sets.done input{border-color:transparent;background:rgba(46,204,143,.08);color:var(--silver)}
.sets.head{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.check{width:46px;height:46px;border-radius:14px;border:2px solid var(--ac);background:transparent;margin:0 auto;display:flex;align-items:center;justify-content:center;padding:0}
.check.ok{background:var(--ok);border-color:var(--ok)}
.info{font-size:13px;line-height:1.45;color:var(--silver);background:rgba(255,255,255,.04);border-radius:12px;padding:10px 12px}
.restbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);max-width:456px;margin:0 auto;background:#16224A;border:1px solid color-mix(in srgb,var(--ac) 60%,transparent);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:20;box-shadow:0 14px 36px rgba(0,0,0,.5)}
.big{font-family:Sora,sans-serif;font-size:34px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
/* Feuille */
.ov{position:fixed;inset:0;background:rgba(3,7,20,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fi .18s}
.sheet{background:#111A3A;width:100%;max-width:520px;border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;animation:su .22s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(201,206,214,.25);margin:0 auto 4px}
@keyframes su{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{min-height:50px;border-radius:13px;border:1px solid rgba(201,206,214,.18);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:19px;padding:4px 0}
.scale button span{font-size:10px;color:var(--muted);font-weight:600}
.scale button.on{border-color:var(--gold);background:rgba(212,175,106,.16)}
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini{display:flex;flex-direction:column;gap:4px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.mini input,.mini select{height:44px;width:100%;border-radius:11px;border:1px solid rgba(201,206,214,.18);background:var(--bg);color:var(--text);text-align:center;font-weight:700;font-size:16px;padding:0 2px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sw-pick{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0}
.sw-pick.on{border-color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.link{background:none;border:none;color:var(--gold);font-weight:600;font-size:14px;padding:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
var KEY='mfc-coaching-v2', OLD='mfc-coaching-v1';
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,10)};
function loc(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
var TODAY=loc(new Date());
function add(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return loc(d)}
function diff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
var JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function dd(s){return new Date(s+'T12:00:00')}
function cap(s){return s?s[0].toUpperCase()+s.slice(1):s}
function dLong(s){var d=dd(s);return cap(JOURS[d.getDay()])+' '+d.getDate()+' '+MOIS[d.getMonth()]}
function dShort(s){var d=dd(s);return JOURS[d.getDay()].slice(0,3)+'. '+d.getDate()+' '+MOIS[d.getMonth()].slice(0,4).replace(/\.$/,'')+(MOIS[d.getMonth()].length>4?'.':'')}
function dRel(s){var n=diff(TODAY,s);if(n===0)return 'Aujourd’hui';if(n===1)return 'Demain';if(n===-1)return 'Hier';if(n>1&&n<7)return cap(JOURS[dd(s).getDay()]);return dShort(s)}
function monday(s){var w=dd(s).getDay();return add(s,-((w+6)%7))}
function fmt(n){if(n===''||n==null||isNaN(n))return '';return String(Math.round(n*100)/100).replace('.',',')}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function hms(s){s=Math.max(0,Math.floor(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+' h '+String(m).padStart(2,'0'):m+' min'}
function restTxt(s){return s>=60?(Math.floor(s/60)+' min'+(s%60?' '+String(s%60).padStart(2,'0'):'')):s+' s'}
function clone(o){return JSON.parse(JSON.stringify(o))}
function isTime(e){return e.unit==='min'}
function unitL(e){return e.unit==='sec'?'s':e.unit==='min'?'min':'reps'}

/* ---------- Icônes ---------- */
var IC={home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/>',chart:'<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',back:'<polyline points="15 18 9 12 15 6"/>',chev:'<polyline points="9 6 15 12 9 18"/>',left:'<polyline points="15 6 9 12 15 18"/>',check:'<polyline points="5 12 10 17 19 7"/>',x:'<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>',info:'<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.8" r=".7"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',play:'<polygon points="7 4 20 12 7 20 7 4"/>',edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',move:'<polyline points="5 9 2 12 5 15"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/>',copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>',plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',dumb:'<path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/>',trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',flame:'<path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-5 5-5 8-1-1-2-2-2-4-2 2-2 5-2 8 0 4 3 7 7 7z"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',up:'<polyline points="6 15 12 9 18 15"/>',down:'<polyline points="6 9 12 15 18 9"/>',clock:'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',dl:'<path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 21h14"/>',spark:'<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/>',cloud:'<path d="M17.5 19H7a5 5 0 1 1 .9-9.9A6 6 0 0 1 19.4 11 4 4 0 0 1 17.5 19z"/>',key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M16 7l3 3M18.5 4.5l2 2"/>'};
function ic(n,s,c,w){return '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="'+(c||'currentColor')+'" stroke-width="'+(w||1.9)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}

/* ---------- Couleurs par type de séance ---------- */
var CATS={pull:{l:'Tirage',c:'#4F8BFF'},push:{l:'Poussée',c:'#FF7A45'},lower:{l:'Jambes',c:'#2ECC8F'},tech:{l:'Technique',c:'#A77BFF'},hyper:{l:'Hypertrophie',c:'#FF5C8A'},cardio:{l:'Cardio',c:'#22C7D6'},full:{l:'Full body',c:'#D4AF6A'}};
function catKey(s){if(s.color&&CATS[s.color])return s.color;var n=(s.name||'').toLowerCase();
 if(/technique|street|skill/.test(n))return 'tech';
 if(/footing|course|run|trail|cardio|vélo|velo|natation|marche|fractionn|endurance|zone 2/.test(n))return 'cardio';
 if(/pull|tirage|traction|\bdos\b/.test(n))return 'pull';
 if(/push|pouss|pector|développé/.test(n))return 'push';
 if(/lower|jambe|squat|bas du corps|\bleg|cuisse/.test(n))return 'lower';
 if(/hypertroph|upper|haut du corps|volume/.test(n))return 'hyper';
 return 'full'}
function col(s){return CATS[catKey(s)].c}
function title(s){var m=String(s.name||'').match(/^(S\d+)\s*·\s*([^—–]+?)\s*[—–]\s*(.+)$/);return m?{t:m[3],sub:m[1]+' · '+m[2].trim(),w:+m[1].slice(1)}:{t:s.name||'Séance',sub:'',w:null}}

/* ---------- Données ---------- */
